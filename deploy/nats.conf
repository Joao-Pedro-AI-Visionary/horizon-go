# Embedded NATS for the single-container deploy (cmd/supervise starts it).
# Only reachable inside the container. JetStream lives in /tmp: Render free
# services have no persistent disk, so pending messages are lost on restart or
# spin-down. That is acceptable: every item is in Postgres and the worker's
# periodic backfill re-queues unscored / undeduped work from the database.
listen: 127.0.0.1:4222
server_name: horizon-embedded
max_payload: 4MB

jetstream {
  store_dir: /tmp/nats
  max_memory_store: 32MB
  max_file_store: 256MB
}
